// ตาราง 5: ผลประโยชน์จากชั้นอาชีพ (CAREER) — คุณวุฒิที่ต้องทำในแต่ละปี ตามอายุงานตัวแทน
const CAREER_REQ = {
    2: { minCases: 10, minFYC: 60000, minPersistency: 70 },
    3: { minCases: 12, minFYC: 80000, minPersistency: 71 },
    4: { minCases: 14, minFYC: 100000, minPersistency: 73 },
    5: { minCases: 16, minFYC: 120000, minPersistency: 75 }, // ใช้เกณฑ์นี้กับอายุงาน 5 ปีขึ้นไปด้วย
};
function careerReqForTenure(t) {
    if (t < 2)
        return null; // ยังไม่ถึงเกณฑ์ขั้นต่ำ
    if (t >= 5)
        return CAREER_REQ[5];
    return CAREER_REQ[t];
}
// % ผลประโยชน์จากผลรวม RYC (Renewal Year Commission) ตามช่วงอายุงานตัวแทน (ตท.)
function careerPayoutPct(t) {
    if (t >= 11)
        return 80;
    if (t >= 6)
        return 70;
    if (t >= 2)
        return 60;
    return 0;
}
function quarterBonusPct(fyc) {
    for (const b of QUARTER_BONUS)
        if (fyc >= b.min)
            return b.pct;
    return 0;
}
function annualBonusPct(fyc, tier) {
    for (const b of ANNUAL_BONUS) {
        if (fyc >= b.min)
            return tier === "90" ? b.t90 : tier === "85" ? b.t85 : b.t75;
    }
    return 0;
}
// Per-case commission schedule across 60 months (relative to sale month)
function perCaseSchedule({ premiumPerInstallment, modeKey, rates, specialFirstYear }) {
    const totalMonths = 60;
    const sched = [];
    for (let r = 1; r <= totalMonths; r++) {
        const policyYear = Math.ceil(r / 12);
        const m = ((r - 1) % 12) + 1;
        let collected = 0;
        if (modeKey === "annual") {
            if (m === 1)
                collected = premiumPerInstallment;
        }
        else if (modeKey === "semiannual") {
            if (m === 1 || m === 7)
                collected = premiumPerInstallment;
        }
        else if (modeKey === "quarterly") {
            if ([1, 4, 7, 10].includes(m))
                collected = premiumPerInstallment;
        }
        else {
            // monthly
            const useSpecial = policyYear === 1 && specialFirstYear;
            if (useSpecial) {
                if (m === 1)
                    collected = premiumPerInstallment * 2;
                else if (m === 2)
                    collected = 0;
                else
                    collected = premiumPerInstallment;
            }
            else {
                collected = premiumPerInstallment;
            }
        }
        const rate = (rates[Math.min(policyYear, 5) - 1] || 0) / 100;
        sched.push({ r, policyYear, collected, commission: collected * rate });
    }
